[project]
name = "ai-knowledge-base"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vikraman1653763", email = "133756180+vikraman1653763@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.143.3",
    "google-genai>=2.31.0",
    "pypdf>=6.21.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-knowledge-base = "ai_knowledge_base:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
